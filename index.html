<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Sync Cinema - مشاهدة تزامنية لكافة المواقع والفيديوهات</title>
  
  <!-- خط Google Fonts Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- مكتبة PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-color: #060911;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.12) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main App Layout */
    .app-container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Navbar */
    .navbar {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a5b4fc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .id-tag {
      background: rgba(10, 15, 30, 0.7);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .id-tag code {
      font-family: monospace;
      color: #38bdf8;
      font-weight: bold;
    }

    /* Cinema Video Player Container (Universal Multi-Engine) */
    .cinema-wrapper {
      width: 100%;
      position: relative;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-bottom: 52%; /* Large Cinema ratio */
      height: 0;
      overflow: hidden;
      border-radius: var(--radius);
      background: #000;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9), 0 0 50px rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .player-container {
        padding-bottom: 56.25%;
      }
    }

    .player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Controls & Connection Panel Grid */
    .panels-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 992px) {
      .panels-grid {
        grid-template-columns: 1.3fr 0.7fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    .source-type-tag {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 15, 30, 0.8);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      opacity: 0.94;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* Badges & Status */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .badge-disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }
    .badge-disconnected .badge-dot { background: var(--danger); }

    .badge-connecting {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
    }
    .badge-connecting .badge-dot { background: var(--warning); animation: pulse 1.5s infinite; }

    .badge-connected {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
    }
    .badge-connected .badge-dot { background: var(--success); box-shadow: 0 0 10px var(--success); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      font-size: 0.9rem;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="brand">
      <span style="font-size: 1.5rem;">🌐</span>
      <h1>Universal Video Sync Cinema</h1>
    </div>

    <div class="nav-actions">
      <!-- Status Badge -->
      <span id="status-badge" class="badge badge-disconnected">
        <span class="badge-dot"></span>
        <span id="status-text">غير متصل</span>
      </span>

      <!-- My ID tag -->
      <div class="id-tag">
        <span>غرفتك:</span>
        <code id="my-id">جاري التحميل...</code>
        <button class="btn btn-secondary btn-sm" onclick="copyMyId()">📋 نسخ ID</button>
        <button class="btn btn-secondary btn-sm" onclick="copyRoomLink()">🔗 الرابط</button>
      </div>
    </div>
  </div>

  <!-- Universal Multi-Engine Video Player Container -->
  <div class="cinema-wrapper">
    <div class="player-container">
      <!-- YouTube API Player Wrapper -->
      <div id="yt-player-wrapper" class="player-wrapper">
        <div id="player"></div>
      </div>
      <!-- HTML5 Direct Video Player (MP4 / WebM / OGG / HLS / M3U8) -->
      <video id="html5-player" class="player-wrapper" controls style="display:none; width:100%; height:100%; object-fit:contain; background:#000;"></video>
      <!-- Generic iFrame Embed Player (Vimeo, Dailymotion, Custom Sites) -->
      <iframe id="iframe-player" class="player-wrapper" style="display:none; width:100%; height:100%; border:none;" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Minimal Control Grid -->
  <div class="panels-grid">
    <!-- Video Loader Card with Engine Type Indicator -->
    <div class="card">
      <div class="card-title">
        <div style="display:flex; align-items:center; gap:8px;">
          <span>🌐 رابط الفيديو أو الموقع</span>
          <span id="source-type-badge" class="source-type-tag">🔴 YouTube</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="userForceSync()" title="إعادة مزامنة الوقت والسرعة فورياً مع باقي الأطراف">🔄 مزامنة الوقت الآن</button>
      </div>
      <div class="input-group">
        <input type="text" id="video-url-input" placeholder="أدخل رابط من YouTube, Vimeo, Dailymotion, أو رابط MP4/M3U8 مباشر...">
        <button class="btn btn-primary" onclick="userLoadAndSyncVideo()">تغيير للجميع 🚀</button>
      </div>
    </div>

    <!-- Peer Connection Card -->
    <div class="card">
      <div class="card-title">
        <span>🔗 الانضمام لصديق</span>
        <span id="peer-count" style="color: var(--accent); font-size: 0.85rem;">0 متصلين</span>
      </div>
      <div class="input-group">
        <input type="text" id="peer-id-input" placeholder="أدخل ID صديقك للانضمام...">
        <button class="btn btn-primary" onclick="connectToPeer()">اتصال ⚡</button>
      </div>
    </div>
  </div>

</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- YouTube IFrame API Script -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  // Global State & Peer Setup
  let peer = null;
  let activeConnections = new Map();
  let ytPlayer = null;
  let isPlayerReady = false;
  let isRemoteAction = false;
  
  // Current Media Source State
  let activeEngine = 'youtube'; // 'youtube' | 'html5' | 'iframe'
  let currentSourceUrl = 'dQw4w9WgXcQ';
  let isAdPlaying = false;

  let lastRecordedRate = 1;
  let lastRecordedMuted = false;
  let lastRecordedVolume = 100;
  let lastRecordedTime = 0;
  let lastCheckTimestamp = Date.now();

  const html5Video = document.getElementById('html5-player');
  const iframePlayer = document.getElementById('iframe-player');
  const ytWrapper = document.getElementById('yt-player-wrapper');

  // --- 1. Universal Engine Switcher & Detection ---
  function detectSourceType(url) {
    if (!url) return 'youtube';
    const trimmed = url.trim();

    // Direct MP4 / WebM / OGG / M3U8 video file extension or blob
    if (/\.(mp4|webm|ogg|m3u8|mov|mpd)(\?.*)?$/i.test(trimmed) || trimmed.startsWith('blob:') || trimmed.startsWith('data:video/')) {
      return 'html5';
    }

    // YouTube URLs
    if (/(youtube\.com|youtu\.be)/i.test(trimmed) || /^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
      return 'youtube';
    }

    // Generic Website / Vimeo / Dailymotion Embed
    return 'iframe';
  }

  function setEngine(engineType, src) {
    activeEngine = engineType;
    currentSourceUrl = src;

    // Hide all wrappers initially
    ytWrapper.style.display = 'none';
    html5Video.style.display = 'none';
    iframePlayer.style.display = 'none';

    const badge = document.getElementById('source-type-badge');

    if (engineType === 'youtube') {
      ytWrapper.style.display = 'block';
      badge.innerText = '🔴 YouTube';
      badge.style.background = 'rgba(239, 68, 68, 0.2)';
      badge.style.color = '#fca5a5';

      const videoId = extractYouTubeId(src);
      if (isPlayerReady && ytPlayer && ytPlayer.loadVideoById) {
        isRemoteAction = true;
        ytPlayer.loadVideoById(videoId, 0);
        setTimeout(() => { isRemoteAction = false; }, 500);
      }
    } else if (engineType === 'html5') {
      html5Video.style.display = 'block';
      badge.innerText = '🎬 فيديو مباشر (MP4/HLS)';
      badge.style.background = 'rgba(34, 197, 94, 0.2)';
      badge.style.color = '#86efac';

      isRemoteAction = true;
      html5Video.src = src;
      html5Video.load();
      setTimeout(() => { isRemoteAction = false; }, 500);
    } else if (engineType === 'iframe') {
      iframePlayer.style.display = 'block';
      badge.innerText = '🌐 موقع / Embed خارجي';
      badge.style.background = 'rgba(168, 85, 247, 0.2)';
      badge.style.color = '#d8b4fe';

      let embedUrl = src;
      // Convert Vimeo or Dailymotion link to embed URL if needed
      if (src.includes('vimeo.com/') && !src.includes('player.vimeo.com')) {
        const vimeoId = src.split('vimeo.com/')[1].split('?')[0].split('#')[0];
        embedUrl = `https://player.vimeo.com/video/${vimeoId}`;
      } else if (src.includes('dailymotion.com/video/') && !src.includes('embed')) {
        const dmId = src.split('dailymotion.com/video/')[1].split('?')[0];
        embedUrl = `https://www.dailymotion.com/embed/video/${dmId}`;
      }

      iframePlayer.src = embedUrl;
    }
  }

  // --- 2. HTML5 Video Event Listeners (Full Parity with PeerJS Sync) ---
  html5Video.addEventListener('play', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({ type: 'PLAY', currentTime: html5Video.currentTime, rate: html5Video.playbackRate });
  });

  html5Video.addEventListener('pause', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({ type: 'PAUSE', currentTime: html5Video.currentTime });
  });

  html5Video.addEventListener('seeking', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({ type: 'SEEK', currentTime: html5Video.currentTime });
  });

  html5Video.addEventListener('ratechange', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({ type: 'RATE_CHANGE', rate: html5Video.playbackRate });
    showToast(`⚡ تم تغيير السرعة إلى: ${html5Video.playbackRate}x`);
  });

  html5Video.addEventListener('volumechange', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({
      type: 'VOLUME_CHANGE',
      isMuted: html5Video.muted,
      volume: Math.round(html5Video.volume * 100)
    });
  });

  html5Video.addEventListener('ended', () => {
    if (isRemoteAction || activeEngine !== 'html5') return;
    broadcastSignal({ type: 'ENDED' });
  });

  // --- 3. YouTube IFrame API Handler ---
  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: 'dQw4w9WgXcQ',
      playerVars: {
        'autoplay': 0,
        'controls': 1,
        'rel': 0,
        'enablejsapi': 1,
        'origin': window.location.origin
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange,
        'onPlaybackRateChange': onPlaybackRateChange,
        'onPlaybackQualityChange': onPlaybackQualityChange,
        'onError': onPlayerError
      }
    });
  }

  function onPlayerReady(event) {
    isPlayerReady = true;
    showToast('جاهز لتشغيل ومزامنة الفيديوهات والمواقع بالكامل 🎬');
  }

  function checkIsAd() {
    if (activeEngine !== 'youtube' || !ytPlayer || !ytPlayer.getVideoData) return false;
    const data = ytPlayer.getVideoData();
    return (data && (data.isAd || data.ad_device));
  }

  function onPlayerStateChange(event) {
    if (isRemoteAction || activeEngine !== 'youtube') return;

    if (checkIsAd()) {
      if (!isAdPlaying) {
        isAdPlaying = true;
        showToast('📢 يجرى عرض إعلان لدى أحد الأطراف (تجميد المزامنة المؤقت)');
      }
      return;
    } else if (isAdPlaying) {
      isAdPlaying = false;
      showToast('✅ انتهى الإعلان، جاري استئناف المزامنة التلقائية');
      userForceSync();
      return;
    }

    const currentTime = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
    const currentRate = ytPlayer.getPlaybackRate ? ytPlayer.getPlaybackRate() : 1;

    if (event.data === YT.PlayerState.PLAYING) {
      broadcastSignal({ type: 'PLAY', currentTime: currentTime, rate: currentRate });
    } else if (event.data === YT.PlayerState.PAUSED) {
      broadcastSignal({ type: 'PAUSE', currentTime: currentTime });
    } else if (event.data === YT.PlayerState.BUFFERING) {
      broadcastSignal({ type: 'SEEK', currentTime: currentTime });
    } else if (event.data === YT.PlayerState.ENDED) {
      broadcastSignal({ type: 'ENDED' });
    }
  }

  function onPlaybackRateChange(event) {
    if (isRemoteAction || activeEngine !== 'youtube') return;
    const newRate = event.data;
    broadcastSignal({ type: 'RATE_CHANGE', rate: newRate });
    showToast(`⚡ تم تغيير سرعة التشغيل إلى: ${newRate}x`);
  }

  function onPlaybackQualityChange(event) {
    if (isRemoteAction || activeEngine !== 'youtube') return;
    broadcastSignal({ type: 'QUALITY_CHANGE', quality: event.data });
    showToast(`📐 تم تغيير الجودة إلى: ${event.data}`);
  }

  function onPlayerError(event) {
    console.warn('Player Error:', event.data);
    showToast('⚠️ يتعذر تشغيل المصدر بسبب قيود التضمين للموقع الاصلي');
  }

  // --- 4. Periodic Monitor for Native Controls ---
  setInterval(() => {
    if (activeEngine === 'youtube' && isPlayerReady && ytPlayer && ytPlayer.getCurrentTime) {
      if (checkIsAd()) {
        isAdPlaying = true;
        return;
      } else if (isAdPlaying) {
        isAdPlaying = false;
        userForceSync();
      }

      const currentTime = ytPlayer.getCurrentTime();
      const now = Date.now();
      const state = ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1;
      const currentRate = ytPlayer.getPlaybackRate ? ytPlayer.getPlaybackRate() : 1;
      const isMuted = ytPlayer.isMuted ? ytPlayer.isMuted() : false;
      const volume = ytPlayer.getVolume ? ytPlayer.getVolume() : 100;

      if (!isRemoteAction) {
        if (isMuted !== lastRecordedMuted) {
          lastRecordedMuted = isMuted;
          broadcastSignal({ type: 'VOLUME_CHANGE', isMuted: isMuted, volume: volume });
          showToast(`🔊 تم ${isMuted ? 'كتم' : 'تشغيل'} الصوت لدى الجميع`);
        } else if (Math.abs(volume - lastRecordedVolume) > 5) {
          lastRecordedVolume = volume;
          broadcastSignal({ type: 'VOLUME_CHANGE', isMuted: isMuted, volume: volume });
          showToast(`🔊 تم تغيير مستوى الصوت إلى: ${volume}%`);
        }
      }

      if (isRemoteAction) {
        lastRecordedTime = currentTime;
        lastCheckTimestamp = now;
        lastRecordedMuted = isMuted;
        lastRecordedVolume = volume;
        return;
      }

      if (state === YT.PlayerState.PLAYING) {
        const elapsedSeconds = ((now - lastCheckTimestamp) / 1000) * currentRate;
        const expectedTime = lastRecordedTime + elapsedSeconds;

        if (Math.abs(currentTime - expectedTime) > 1.2) {
          broadcastSignal({ type: 'SEEK', currentTime: currentTime });
        }
      }
      lastRecordedTime = currentTime;
      lastCheckTimestamp = now;
    }
  }, 350);

  // --- 5. PeerJS Setup & Universal Signal Handler ---
  function initPeerJS() {
    updateStatus('connecting', 'جاري الاتصال بالسيرفر...');
    peer = new Peer({ debug: 1 });

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
      updateStatus('disconnected', 'جاهز للاتصال');
      showToast('تم الاتصال بموزع PeerJS بنجاح ✅');

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam && roomParam !== id) {
        document.getElementById('peer-id-input').value = roomParam;
        connectToPeer(roomParam);
      }
    });

    peer.on('connection', (conn) => {
      registerConnection(conn);
    });

    peer.on('disconnected', () => {
      updateStatus('disconnected', 'انقطع الاتصال');
      showToast('⚠️ انقطع الاتصال بالسيرفر، جاري المحاولة...');
      peer.reconnect();
    });

    peer.on('error', (err) => {
      console.error('PeerJS Error:', err);
      showToast('❌ خطأ في الاتصال: ' + (err.type || err.message));
      updateStatus('disconnected', 'خطأ بالاتصال');
    });
  }

  function connectToPeer(targetId) {
    const remoteId = targetId || document.getElementById('peer-id-input').value.trim();
    if (!remoteId) return showToast('⚠️ يرجى إدخال ID الطرف الآخر');
    if (remoteId === peer.id) return showToast('⚠️ لا يمكنك الاتصال بنفسك!');
    if (activeConnections.has(remoteId)) return showToast('ملاحظة: أنت متصل بالفعل بهذا الطرف');

    updateStatus('connecting', 'جاري الاتصال...');
    const conn = peer.connect(remoteId, { reliable: true });
    registerConnection(conn);
  }

  function registerConnection(conn) {
    const setupListeners = () => {
      activeConnections.set(conn.peer, conn);
      updatePeerCountUI();
      updateStatus('connected', `متصل (${activeConnections.size})`);
      showToast(`تم الاتصال بنجاح مع: ${conn.peer} ✅`);

      // Send initial state to newly connected peer
      let currentTime = 0;
      let isPlaying = false;
      let rate = 1;

      if (activeEngine === 'youtube' && isPlayerReady && ytPlayer && ytPlayer.getCurrentTime) {
        currentTime = ytPlayer.getCurrentTime();
        isPlaying = ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
        rate = ytPlayer.getPlaybackRate ? ytPlayer.getPlaybackRate() : 1;
      } else if (activeEngine === 'html5') {
        currentTime = html5Video.currentTime;
        isPlaying = !html5Video.paused;
        rate = html5Video.playbackRate;
      }

      conn.send({
        type: 'SYNC_INITIAL_STATE',
        engineType: activeEngine,
        src: currentSourceUrl,
        currentTime: currentTime,
        isPlaying: isPlaying,
        rate: rate
      });
    };

    if (conn.open) setupListeners();
    else conn.on('open', setupListeners);

    conn.on('data', (data) => handleRemoteSignal(data, conn));

    conn.on('close', () => {
      activeConnections.delete(conn.peer);
      updatePeerCountUI();
      showToast(`انقطع الاتصال مع: ${conn.peer} ❌`);
      if (activeConnections.size === 0) updateStatus('disconnected', 'غير متصل');
      else updateStatus('connected', `متصل (${activeConnections.size})`);
    });

    conn.on('error', (err) => {
      activeConnections.delete(conn.peer);
      updatePeerCountUI();
    });
  }

  function broadcastSignal(data) {
    activeConnections.forEach((conn) => {
      if (conn && conn.open) conn.send(data);
    });
  }

  // --- 6. Universal Remote Signal Execution ---
  function handleRemoteSignal(data, senderConn) {
    isRemoteAction = true;

    switch (data.type) {
      case 'CHANGE_SOURCE':
        setEngine(data.engineType, data.src);
        showToast('🌐 تم تغيير مصدر الفيديو/الموقع بواسطة الطرف الآخر');
        break;

      case 'PLAY':
        if (activeEngine === 'youtube' && ytPlayer) {
          if (data.rate && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(data.rate);
          syncTime(data.currentTime);
          ytPlayer.playVideo();
        } else if (activeEngine === 'html5') {
          if (data.rate) html5Video.playbackRate = data.rate;
          html5Video.currentTime = data.currentTime;
          html5Video.play();
        }
        showToast('▶️ تشغيل بواسطة الطرف الآخر');
        break;

      case 'PAUSE':
        if (activeEngine === 'youtube' && ytPlayer) {
          syncTime(data.currentTime);
          ytPlayer.pauseVideo();
        } else if (activeEngine === 'html5') {
          html5Video.currentTime = data.currentTime;
          html5Video.pause();
        }
        showToast('⏸️ إيقاف مؤقت بواسطة الطرف الآخر');
        break;

      case 'SEEK':
        if (activeEngine === 'youtube' && ytPlayer) {
          ytPlayer.seekTo(data.currentTime, true);
        } else if (activeEngine === 'html5') {
          html5Video.currentTime = data.currentTime;
        }
        showToast('⏩ تقديم/تأخير بواسطة الطرف الآخر');
        break;

      case 'RATE_CHANGE':
        if (activeEngine === 'youtube' && ytPlayer && ytPlayer.setPlaybackRate) {
          ytPlayer.setPlaybackRate(data.rate);
        } else if (activeEngine === 'html5') {
          html5Video.playbackRate = data.rate;
        }
        showToast(`⚡ تغيرت السرعة إلى: ${data.rate}x`);
        break;

      case 'VOLUME_CHANGE':
        if (activeEngine === 'youtube' && ytPlayer) {
          if (data.isMuted && ytPlayer.mute) ytPlayer.mute();
          else {
            if (ytPlayer.unMute) ytPlayer.unMute();
            if (ytPlayer.setVolume && data.volume !== undefined) ytPlayer.setVolume(data.volume);
          }
        } else if (activeEngine === 'html5') {
          html5Video.muted = data.isMuted;
          if (data.volume !== undefined) html5Video.volume = data.volume / 100;
        }
        showToast('🔊 تم تغيير إعدادات الصوت بواسطة الطرف الآخر');
        break;

      case 'QUALITY_CHANGE':
        if (activeEngine === 'youtube' && ytPlayer && ytPlayer.setPlaybackQuality) {
          ytPlayer.setPlaybackQuality(data.quality);
          showToast(`📐 تغيير الجودة إلى: ${data.quality}`);
        }
        break;

      case 'ENDED':
        if (activeEngine === 'youtube' && ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        else if (activeEngine === 'html5') html5Video.pause();
        showToast('🏁 انتهى التشغيل لدي الطرف الآخر');
        break;

      case 'SYNC_INITIAL_STATE':
        setEngine(data.engineType, data.src);
        setTimeout(() => {
          if (data.engineType === 'youtube' && ytPlayer) {
            ytPlayer.seekTo(data.currentTime || 0, true);
            if (data.rate && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(data.rate);
            if (data.isPlaying) ytPlayer.playVideo();
            else ytPlayer.pauseVideo();
          } else if (data.engineType === 'html5') {
            html5Video.currentTime = data.currentTime || 0;
            if (data.rate) html5Video.playbackRate = data.rate;
            if (data.isPlaying) html5Video.play();
            else html5Video.pause();
          }
        }, 600);
        showToast('🔄 تم استقبال حالة الغرفة ومزامنتها بالكامل');
        break;

      case 'FORCE_SYNC':
        if (activeEngine === 'youtube' && ytPlayer) {
          if (data.rate && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(data.rate);
          ytPlayer.seekTo(data.currentTime, true);
          if (data.isPlaying) ytPlayer.playVideo();
          else ytPlayer.pauseVideo();
        } else if (activeEngine === 'html5') {
          if (data.rate) html5Video.playbackRate = data.rate;
          html5Video.currentTime = data.currentTime;
          if (data.isPlaying) html5Video.play();
          else html5Video.pause();
        }
        showToast('🔄 تم تطبيق إعادة المزامنة الإجبارية');
        break;
    }

    setTimeout(() => { isRemoteAction = false; }, 500);
  }

  function syncTime(targetTime) {
    if (activeEngine === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
      if (Math.abs(ytPlayer.getCurrentTime() - targetTime) > 1.5) ytPlayer.seekTo(targetTime, true);
    } else if (activeEngine === 'html5') {
      if (Math.abs(html5Video.currentTime - targetTime) > 1.5) html5Video.currentTime = targetTime;
    }
  }

  // --- 7. User Action Triggers ---
  function userLoadAndSyncVideo() {
    const input = document.getElementById('video-url-input').value.trim();
    if (!input) return showToast('⚠️ يرجى إدخال رابط فيديو أو موقع');

    const engineType = detectSourceType(input);
    setEngine(engineType, input);

    broadcastSignal({
      type: 'CHANGE_SOURCE',
      engineType: engineType,
      src: input
    });
    showToast('🚀 تم تحميل المصدر وتحديث الغرفة للجميع');
  }

  function userForceSync() {
    let currentTime = 0;
    let isPlaying = false;
    let rate = 1;

    if (activeEngine === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
      currentTime = ytPlayer.getCurrentTime();
      isPlaying = ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
      rate = ytPlayer.getPlaybackRate ? ytPlayer.getPlaybackRate() : 1;
    } else if (activeEngine === 'html5') {
      currentTime = html5Video.currentTime;
      isPlaying = !html5Video.paused;
      rate = html5Video.playbackRate;
    }

    broadcastSignal({
      type: 'FORCE_SYNC',
      engineType: activeEngine,
      currentTime: currentTime,
      isPlaying: isPlaying,
      rate: rate
    });
    showToast('🔄 تم إرسال أمر المزامنة اللحظية للجميع');
  }

  // --- 8. Helper Functions ---
  function extractYouTubeId(url) {
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : url;
  }

  function updateStatus(state, text) {
    const badge = document.getElementById('status-badge');
    const textEl = document.getElementById('status-text');
    badge.className = `badge badge-${state}`;
    textEl.innerText = text;
  }

  function updatePeerCountUI() {
    document.getElementById('peer-count').innerText = `${activeConnections.size} متصلين`;
  }

  function copyMyId() {
    const myId = document.getElementById('my-id').innerText;
    if (!myId || myId.includes('جاري')) return showToast('لم يتم تجهيز المعرف بعد');
    navigator.clipboard.writeText(myId);
    showToast('📋 تم نسخ ID الغرفة إلى الحافظة');
  }

  function copyRoomLink() {
    const myId = document.getElementById('my-id').innerText;
    if (!myId || myId.includes('جاري')) return showToast('لم يتم تجهيز المعرف بعد');
    const roomUrl = `${window.location.origin}${window.location.pathname}?room=${myId}`;
    navigator.clipboard.writeText(roomUrl);
    showToast('🔗 تم نسخ رابط الغرفة المباشر للحافظة');
  }

  function showToast(message) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  window.addEventListener('DOMContentLoaded', () => {
    initPeerJS();
  });
</script>
